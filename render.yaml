services:
  - type: web
    name: akshaya-patra-app
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: akshaya-patra-postgres
          property: connectionString
      - key: NODE_ENV
        value: production

databases:
  - name: akshaya-patra-postgres
    plan: free
    databaseName: akshaya_patra_db
    user: akshaya_admin
